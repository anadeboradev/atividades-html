<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Cartão de Visita</title>

    <style>

        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f2f2f2;
            font-family: Consolas, monospace;
        }

        .cartao {
            width: 320px;
            padding: 20px;
            background: #ffffff;
            border: 2px solid #000;
            box-shadow: 5px 5px 0 #000;
        }

        .cabecalho {
            text-align: center;
        }

        .formacao {
            background: #f2f5ff;
            padding: 10px;
            margin-top: 15px;
            border-left: 4px solid #3366cc;
        }

        .contatos {
            margin-top: 15px;
            padding-top: 10px;
            border-top: 1px dashed #555;
        }

        h2 {
            margin: 0;
        }

        p {
            margin: 8px 0;
        }

    </style>

</head>

<body>

    <div class="cartao">

        <div class="cabecalho">
            <h2 style="color: #3366cc; font-size: 28px;">
                Ana Débora
            </h2>

            <p style="color: #555555;">
                Estudante & Desenvolvedora
            </p>
        </div>

        <div class="formacao">

            <p style="font-size: 16px;">
                💻 Ciência da Computação
            </p>

            <p style="color: #555555;">
                ⚙️ Técnico em Desenvolvimento de Sistemas
            </p>

        </div>

        <div class="contatos">

            <p>
                📧 amunizrodrigueschaves@gmail.com
            </p>

            <p style="color: #333333;">
                📱 (85) 98646-8951
            </p>

            <p style="color: #3366cc;">
                📍 Fortaleza - CE
            </p>

        </div>

    </div>

</body>

</html>
